<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Мій Django Проєкт{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f9; }
        nav { background: #333; color: white; padding: 1rem; }
        nav a { color: white; margin-right: 15px; text-decoration: none; }
        .container { max-width: 800px; margin: 2rem auto; padding: 1rem; background: white; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        footer { text-align: center; padding: 1rem; background: #333; color: white; margin-top: 2rem; }
        .error { color: red; font-size: 0.9em; }
        .success { color: green; font-weight: bold; }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'index' %}">Головна</a>
        <a href="{% url 'register' %}">Реєстрація</a>
    </nav>
    
    <div class="container">
        {% if messages %}
            {% for message in messages %}
                <p class="{{ message.tags }}">{{ message }}</p>
            {% endfor %}
        {% endif %}
        
        {% block content %}
        {% endblock %}
    </div>

    <footer>
        <p>&copy; {% now "Y" %} Конференція Python. Всі права захищено.</p>
    </footer>
</body>
</html>
